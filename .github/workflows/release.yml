name: Build & Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Build React Admin Panel
      run: |
        cd shipwright-core/admin
        npm ci
        npm run build
        # Build işleminin başarılı olup olmadığını görelim
        ls -R dist 

    - name: Prepare Plugin ZIP
      run: |
        mkdir build_temp
        cp -r shipwright-core build_temp/shipwright-ai
        
        # Gereksizleri temizle (node_modules vb) ama dist kalsın!
        cd build_temp/shipwright-ai
        rm -rf admin/node_modules admin/src
        
        # ZIP oluştur
        cd ..
        zip -r shipwright-ai.zip shipwright-ai

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: build_temp/shipwright-ai.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}